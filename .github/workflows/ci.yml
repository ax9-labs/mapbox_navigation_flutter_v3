name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dart:
    name: Dart analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    # Requires a repo secret MAPBOX_DOWNLOADS_TOKEN (a Mapbox secret token
    # with the DOWNLOADS:READ scope - see README.md) so Gradle can resolve
    # the Mapbox Navigation SDK from its private Maven repo. Without it,
    # this job fails at dependency resolution, not at the tests themselves.
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example
      - run: ./gradlew :mapbox_navigation_flutter_v3:testDebugUnitTest
        working-directory: example/android
